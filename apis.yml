aid: ginkgo
name: Ginkgo Bioworks
description: >-
  Ginkgo Bioworks is a synthetic biology company operating autonomous labs and
  a horizontal platform for engineering biology. Its public developer surface is
  the Ginkgo AI Model API (api.ginkgobioworks.ai), which runs inference on public
  and Ginkgo-proprietary biological foundation models — protein and DNA masked
  language models and embedding models such as ESM2 (650M/3B), ginkgo-aa0-650M,
  and ginkgo-maskedlm-3utr-v1. The API is an async, job-polling REST service:
  callers POST a transform request, receive a job result URL, and poll until the
  job completes. Authentication is via an x-api-key header, credits and keys are
  issued from the models portal, and an official Python client (ginkgo-ai-client)
  is published to PyPI. Ginkgo was surfaced as a Felicis portfolio company and
  enriched into the API Evangelist network.
